<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101e2a"><link rel="icon" href="data:,"><title>雨停之前 · 全家便利店</title><style>:root {
  color-scheme: dark;
  --night: #101e2a;
  --paper: #ece2cf;
  --lamp: #efb876;
  --store: #13965b;
  --muted: #b4bbb9;
  --edge: rgba(236, 226, 207, .15);
  --ui-left: max(28px, env(safe-area-inset-left));
  --ui-right: max(28px, env(safe-area-inset-right));
}

* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--night);
  color: var(--paper);
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
body > canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

#vignette, #flash { position: fixed; inset: 0; pointer-events: none; }
#vignette {
  z-index: 5;
  background: radial-gradient(ellipse at 50% 43%, transparent 48%, rgba(6, 13, 20, .38) 100%);
}
#flash { z-index: 6; background: #e0ebf3; opacity: 0; }

#title {
  position: fixed;
  z-index: 10;
  top: max(28px, env(safe-area-inset-top));
  left: var(--ui-left);
  right: var(--ui-right);
  pointer-events: none;
  user-select: none;
  text-shadow: 0 2px 12px rgba(0, 0, 0, .7);
}
#title h1 {
  margin: 0;
  color: var(--paper);
  font-family: "Songti SC", "STSong", "SimSun", serif;
  font-size: 26px;
  font-weight: 400;
  line-height: 1.5;
  letter-spacing: .16em;
}
#title p {
  margin: 5px 0 0;
  color: #c5c6bc;
  font-size: 11px;
  line-height: 1.7;
  letter-spacing: .12em;
}
#hint {
  position: fixed;
  z-index: 10;
  left: var(--ui-left);
  bottom: calc(max(35px, env(safe-area-inset-bottom)) + 64px);
  margin: 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.6;
  letter-spacing: .08em;
  pointer-events: none;
  text-shadow: 0 1px 8px #101e2a;
  transition: opacity .4s ease;
}

#panel {
  position: fixed;
  z-index: 10;
  left: var(--ui-left);
  bottom: max(35px, env(safe-area-inset-bottom));
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: calc(100% - var(--ui-left) - var(--ui-right));
  padding: 6px;
  border: 1px solid var(--edge);
  border-radius: 7px;
  background: rgba(16, 30, 42, .83);
  box-shadow: 0 4px 18px rgba(0, 0, 0, .14);
}
@supports ((backdrop-filter: blur(12px)) or (-webkit-backdrop-filter: blur(12px))) {
  #panel, #restore-ui {
    background: rgba(16, 30, 42, .65);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
  }
}
.grp, .scene-tools { display: flex; align-items: center; }
.grp { gap: 4px; }
.views { flex: 0 0 auto; }
.scene-tools { min-width: 0; gap: 5px; }
.scene-tools > * { flex-shrink: 0; }
.sep { width: 1px; height: 16px; margin: 0 5px; background: var(--edge); }

#panel button, #panel select, #restore-ui {
  min-height: 36px;
  margin: 0;
  padding: 0 10px;
  border: 1px solid transparent;
  border-radius: 4px;
  background: transparent;
  color: var(--paper);
  font: 400 12px/1.4 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  white-space: nowrap;
  cursor: pointer;
  touch-action: manipulation;
  transition: color .15s ease, background-color .15s ease, border-color .15s ease;
}
#panel button.on, #panel button[aria-pressed="true"] {
  color: var(--lamp);
  border-color: rgba(239, 184, 118, .28);
  background: rgba(239, 184, 118, .09);
}
#panel #tour.on, #panel #tour[aria-pressed="true"],
#panel #snd.on, #panel #snd[aria-pressed="true"] {
  color: #c3e6d1;
  border-color: var(--store);
  background: rgba(19, 150, 91, .16);
}
#panel select { max-width: 112px; padding-right: 4px; color: #c5c6bc; }
#panel option { color: var(--paper); background: var(--night); }
#panel #photo { border-color: var(--edge); }
#panel #hide-ui { color: #c5c6bc; }
#panel button:disabled, #panel select:disabled {
  opacity: .45;
  cursor: not-allowed;
}
@media (hover: hover) {
  #panel button:hover:not(:disabled), #panel select:hover:not(:disabled), #restore-ui:hover {
    color: var(--paper);
    border-color: rgba(236, 226, 207, .28);
    background: rgba(236, 226, 207, .09);
  }
}
#panel :focus-visible, #restore-ui:focus-visible {
  outline: 2px solid var(--lamp);
  outline-offset: 2px;
}
#panel .scene-tools:focus-visible { outline-offset: -2px; }
.slider { gap: 8px; padding: 0 3px; font-size: 11px; color: #c5c6bc; }
#rain {
  width: 76px;
  min-width: 0;
  height: 30px;
  margin: 0;
  accent-color: var(--lamp);
  cursor: pointer;
}
#weather-value { min-width: 3.5ch; color: var(--paper); font-size: 10px; font-variant-numeric: tabular-nums; }
#scene-status {
  position: fixed;
  z-index: 10;
  right: var(--ui-right);
  bottom: max(11px, env(safe-area-inset-bottom));
  color: var(--muted);
  font-size: 10px;
  line-height: 1.4;
  letter-spacing: .035em;
  text-shadow: 0 1px 8px #101e2a;
  pointer-events: none;
}
#scene-status::before {
  display: inline-block;
  width: 4px;
  height: 4px;
  margin: 0 7px 2px 0;
  border-radius: 50%;
  background: var(--store);
  content: "";
}
#restore-ui {
  position: fixed;
  z-index: 11;
  right: var(--ui-right);
  bottom: max(20px, env(safe-area-inset-bottom));
  display: none;
  border: 1px solid var(--edge);
  background-color: rgba(16, 30, 42, .7);
}
body.ui-hidden #title, body.ui-hidden #panel,
body.ui-hidden #hint, body.ui-hidden #scene-status { display: none; }
body.ui-hidden #restore-ui { display: block; }

#loading, #err {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 28px;
  background: var(--night);
  text-align: center;
}
#loading { z-index: 50; transition: opacity .65s ease, visibility 0s linear .65s; }
#loading.done { opacity: 0; visibility: hidden; pointer-events: none; }
#loading h2 {
  margin: 0;
  font-family: "Songti SC", "STSong", "SimSun", serif;
  font-size: 26px;
  line-height: 1.5;
  font-weight: 400;
  letter-spacing: .16em;
  color: var(--paper);
}
#loading .bar { width: 128px; height: 1px; overflow: hidden; background: var(--edge); }
#loading .bar i {
  display: block;
  width: 48px;
  height: 100%;
  background: var(--lamp);
  animation: lamp-sweep 1.6s ease-in-out infinite;
}
#loading p { margin: 0; max-width: 32em; color: var(--muted); font-size: 11px; line-height: 1.8; }
@keyframes lamp-sweep {
  from { transform: translateX(-48px); }
  to { transform: translateX(128px); }
}
#err { z-index: 60; display: none; }
#err h3 { margin: 0; font-size: 17px; font-weight: 400; color: var(--lamp); }
#err p { max-width: 34em; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.8; overflow-wrap: anywhere; }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

@media (max-width: 1000px) {
  #panel { flex-direction: column; align-items: stretch; gap: 4px; width: max-content; }
  .views { justify-content: space-between; }
  .scene-tools {
    max-width: 100%;
    padding: 3px;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scrollbar-width: thin;
    scrollbar-color: rgba(236, 226, 207, .25) transparent;
    -webkit-overflow-scrolling: touch;
  }
  .scene-tools::-webkit-scrollbar { height: 3px; }
  .scene-tools::-webkit-scrollbar-thumb { background: rgba(236, 226, 207, .25); border-radius: 2px; }
  .scene-tools::-webkit-scrollbar-track { background: transparent; }
  #hint { bottom: calc(max(35px, env(safe-area-inset-bottom)) + 107px); }
}
@media (max-width: 600px) {
  :root {
    --ui-left: max(14px, env(safe-area-inset-left));
    --ui-right: max(14px, env(safe-area-inset-right));
  }
  #title { top: max(19px, env(safe-area-inset-top)); }
  #title p { font-size: 10px; letter-spacing: .08em; }
  #panel {
    width: calc(100% - var(--ui-left) - var(--ui-right));
    bottom: calc(27px + env(safe-area-inset-bottom));
    padding: 4px;
  }
  .views { display: grid; grid-template-columns: 1.2fr .8fr 1.2fr .8fr; gap: 1px; }
  #panel button, #panel select { min-height: 40px; padding-left: 8px; padding-right: 8px; }
  .views .vbtn { min-width: 0; padding-left: 3px; padding-right: 3px; font-size: 11px; }
  #hint { display: none; }
  #scene-status { bottom: calc(8px + env(safe-area-inset-bottom)); font-size: 9px; }
  #restore-ui { min-height: 44px; }
}
@media (max-height: 450px) and (orientation: landscape) {
  #title { top: max(10px, env(safe-area-inset-top)); }
  #title p, #hint { display: none; }
  #panel { bottom: calc(22px + env(safe-area-inset-bottom)); }
  #scene-status { bottom: calc(5px + env(safe-area-inset-bottom)); }
}
@media (prefers-reduced-motion: reduce) {
  #panel button, #panel select, #restore-ui, #hint, #loading { transition: none; }
  #loading .bar i { animation: none; width: 100%; opacity: .7; }
  #flash { display: none; }
}

<div id="flash" aria-hidden="true"></div>

<header id="title">
  <h1>雨停之前</h1>
  <p>全家便利店 · 二楼有一盏灯</p>
</header>
<p id="hint">换个角度，听一会儿雨。</p>

<section id="panel" aria-label="场景控制">
  <div class="grp views" role="group" aria-label="选择视角">
    <button type="button" class="vbtn on" data-v="0" aria-pressed="true">街角全景</button>
    <button type="button" class="vbtn" data-v="1" aria-pressed="false">店门</button>
    <button type="button" class="vbtn" data-v="2" aria-pressed="false">温暖阳台</button>
    <button type="button" class="vbtn" data-v="3" aria-pressed="false">雨巷</button>
  </div>
  <div class="scene-tools" role="group" aria-label="雨量、声音与画面设置（可横向滚动）" tabindex="0">
    <div class="grp slider">
      <label for="rain">雨量</label>
      <input id="rain" type="range" min="0" max="100" step="1" value="55" aria-describedby="weather-value">
      <output id="weather-value" for="rain">55%</output>
    </div>
    <span class="sep" aria-hidden="true"></span>
    <div class="grp playback" role="group" aria-label="巡游与声音">
      <button type="button" id="tour" aria-pressed="false">巡游</button>
      <button type="button" id="snd" aria-pressed="false">雨声</button>
    </div>
    <span class="sep" aria-hidden="true"></span>
    <div class="grp quality-control">
      <label class="sr-only" for="quality">画质</label>
      <select id="quality" title="画质">
        <option value="balanced" selected>均衡画质</option>
        <option value="high">高画质</option>
      </select>
    </div>
    <button type="button" id="photo">保存画面</button>
    <button type="button" id="hide-ui" aria-pressed="false">隐藏界面</button>
  </div>
</section>

<button type="button" id="restore-ui">显示界面</button>
<small id="scene-status">实时 3D · 拖动环绕 / 滚轮靠近</small>

<div id="loading" role="status" aria-live="polite" aria-atomic="true">
  <h2>雨停之前</h2>
  <div class="bar" aria-hidden="true"><i></i></div>
  <p><span id="load-detail">正在点亮街角的灯…</span></p>
</div>

<div id="err" role="alert" style="display: none;">
  <h3>暂时无法打开这个街角</h3>
  <p id="errmsg">场景未能加载，请刷新页面重试。</p>
</div>
