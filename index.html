<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>中国奶娃大学</title>
<meta name="description" content="奶娃正在护送你前往南京传媒学院。">
<meta name="theme-color" content="#1B4B8D">

<meta property="og:type" content="website">
<meta property="og:title" content="中国奶娃大学">
<meta property="og:description" content="奶娃正在护送你前往南京传媒学院。">
<meta property="og:image" content="https://xn--fiqs8srwb9ipxt8d.com/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preload" as="image" type="image/webp" href="assets/pose2.webp" fetchpriority="high">
<link rel="preload" as="image" type="image/webp" href="assets/badge.webp" fetchpriority="high">

<noscript><meta http-equiv="refresh" content="6;url=https://www.cucn.edu.cn/"></noscript>

<style>
  :root{
    --paper:#FFFDF6; --ink:#16273F; --blue:#1B4B8D; --blue-2:#2F6FBE;
    --gold:#C9A227; --red:#C8342A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 90% at 50% -10%, #F3F7FC 0%, var(--paper) 46%, #FBF3E2 100%);
    color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;overflow:auto;padding:16px;min-height:100%;
  }
  body::after{
    content:"";position:fixed;inset:auto 0 0 0;height:26vh;
    background:linear-gradient(to bottom,transparent,rgba(27,75,141,.09));
    pointer-events:none;
  }

  .sheet{
    position:relative;margin:auto;flex:none;width:min(430px,94vw);
    background:var(--paper);
    border:1px solid rgba(27,75,141,.16);border-radius:4px;
    box-shadow:0 24px 60px -22px rgba(22,39,63,.34), 0 2px 0 rgba(255,255,255,.9) inset;
    padding:30px 26px 26px;text-align:center;
    transform:translateY(14px) scale(.985);opacity:0;
    transition:opacity .5s ease, transform .7s cubic-bezier(.2,.9,.25,1);
  }
  .sheet.in{opacity:1;transform:none}
  .sheet::before{
    content:"";position:absolute;inset:9px;border:1px solid rgba(27,75,141,.14);
    border-radius:2px;pointer-events:none;
  }
  .sheet.shake{animation:shake .3s ease}
  @keyframes shake{0%,100%{transform:none}30%{transform:translate(2px,-2px)}60%{transform:translate(-2px,1px)}}

  .crest{position:relative;width:118px;height:118px;margin:2px auto 0}
  .crest img{
    position:absolute;inset:0;width:100%;height:100%;
    transform:translateY(-26px) scale(.72);opacity:0;
    transition:transform .8s cubic-bezier(.16,1.2,.3,1), opacity .5s ease;
  }
  .crest.in img{transform:none;opacity:1}
  .crest svg{position:absolute;inset:-13px;width:calc(100% + 26px);height:calc(100% + 26px);overflow:visible}
  .crest circle{
    fill:none;stroke:var(--blue);stroke-width:2;stroke-linecap:round;
    stroke-dasharray:452;stroke-dashoffset:452;
    transition:stroke-dashoffset 1.1s ease .12s;
  }
  .crest.in circle{stroke-dashoffset:0}

  h1{margin-top:16px;font-size:31px;letter-spacing:.14em;font-weight:700;color:var(--blue)}
  .dept{margin-top:7px;font-size:12px;letter-spacing:.3em;color:rgba(22,39,63,.5)}
  .rule{width:52px;height:2px;background:var(--gold);margin:15px auto 0;opacity:.85}

  .stage{position:relative;height:196px;margin:6px auto 0}
  .walker{position:absolute;bottom:0;left:0;width:100%;height:100%;will-change:transform}
  .walker img{
    position:absolute;bottom:0;left:0;height:186px;width:auto;
    opacity:0;transition:opacity .05s linear;
  }
  .walker img.on{opacity:1}
  .shadow{
    position:absolute;bottom:2px;left:0;width:118px;height:13px;border-radius:50%;
    background:radial-gradient(50% 50% at 50% 50%, rgba(22,39,63,.26), transparent 70%);
    will-change:transform,opacity;
  }

  .stamp{
    position:absolute;top:14px;right:16px;width:96px;height:96px;
    display:grid;place-items:center;
    border:3px double var(--red);border-radius:50%;
    color:var(--red);font-size:13px;font-weight:700;letter-spacing:.06em;line-height:1.35;
    transform:scale(2.7) rotate(9deg);opacity:0;filter:blur(.4px);
  }
  .stamp.in{animation:drop .42s cubic-bezier(.2,1.5,.4,1) forwards}
  @keyframes drop{
    0%{transform:scale(2.7) rotate(9deg);opacity:0}
    60%{transform:scale(.93) rotate(-13deg);opacity:1}
    100%{transform:scale(1) rotate(-11deg);opacity:1}
  }

  .status{margin-top:4px;font-size:15.5px;line-height:1.75;color:rgba(22,39,63,.86)}
  .status b{color:var(--blue);font-weight:700}

  .meter{margin:16px auto 0;width:min(280px,86%)}
  .bar{height:3px;background:rgba(27,75,141,.14);border-radius:99px;overflow:hidden}
  .fill{height:100%;width:0;background:linear-gradient(90deg,var(--blue-2),var(--blue));border-radius:99px}
  .count{
    display:flex;justify-content:space-between;margin-top:8px;font-size:11px;
    letter-spacing:.16em;color:rgba(22,39,63,.46);font-variant-numeric:tabular-nums;
  }

  .actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
  button,a.btn{
    font:inherit;font-size:13.5px;letter-spacing:.08em;padding:10px 18px;border-radius:99px;
    cursor:pointer;border:1px solid var(--blue);background:transparent;color:var(--blue);
    transition:background .18s ease,color .18s ease,transform .12s ease;
    text-decoration:none;-webkit-tap-highlight-color:transparent;user-select:none;
  }
  a.btn{background:var(--blue);color:var(--paper)}
  button:active,a.btn:active{transform:translateY(1px)}
  a.btn:hover{background:#164077}
  button:hover{background:rgba(27,75,141,.07)}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  .foot{margin:16px 0 4px;text-align:center;font-size:11px;color:rgba(22,39,63,.4);flex:none}
  .foot button{border:0;background:none;color:inherit;font-size:inherit;text-decoration:underline;padding:4px 8px;letter-spacing:.04em}

  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .confetti i{position:absolute;width:7px;height:11px;border-radius:1px;opacity:0;will-change:transform,opacity}

  dialog{
    border:1px solid rgba(27,75,141,.2);border-radius:6px;padding:26px 24px;max-width:390px;width:88vw;
    color:var(--ink);background:var(--paper);font-size:14px;line-height:1.85;
    box-shadow:0 30px 70px -20px rgba(22,39,63,.4);
  }
  dialog::backdrop{background:rgba(22,39,63,.42);backdrop-filter:blur(2px)}
  dialog h2{font-size:16px;color:var(--blue);margin-bottom:10px;letter-spacing:.08em}
  dialog p{color:rgba(22,39,63,.78)}
  dialog p+p{margin-top:9px}
  dialog button{margin-top:18px;width:100%}

  @media (max-height:660px){
    .stage{height:150px}.walker img{height:142px}.crest{width:92px;height:92px}
    h1{font-size:26px}.sheet{padding:20px 20px 18px}
  }
  @media (max-height:480px){
    .stage{height:112px}.walker img{height:106px}.crest{width:68px;height:68px}
    .crest svg{inset:-8px}
    h1{font-size:22px;margin-top:10px}.dept{font-size:10px;letter-spacing:.22em}
    .status{font-size:13.5px;line-height:1.5}.sheet{padding:14px 18px 14px}
    .meter{margin-top:10px}.actions{margin-top:12px}
    button,a.btn{padding:8px 14px;font-size:12.5px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
    .confetti{display:none}
  }
</style>
</head>
<body>

<main class="sheet" id="sheet">
  <div class="crest" id="crest">
    <svg viewBox="0 0 150 150" aria-hidden="true"><circle cx="75" cy="75" r="72"/></svg>
    <img src="assets/badge.webp" alt="南京传媒学院校徽" width="118" height="118">
  </div>

  <h1>中国奶娃大学</h1>
  <p class="dept">新 生 护 送 中 心</p>
  <div class="rule"></div>

  <div class="stage">
    <div class="walker" id="walker">
      <img src="assets/pose1.webp" alt="" class="f">
      <img src="assets/pose2.webp" alt="奶娃挥手欢迎你" class="f">
      <img src="assets/pose3.webp" alt="" class="f">
    </div>
    <div class="shadow" id="shadow"></div>
    <div class="stamp" id="stamp" aria-hidden="true">录取<br>专用章</div>
  </div>

  <p class="status" id="status" aria-live="polite">奶娃正在护送你前往<br><b>南京传媒学院</b></p>

  <div class="meter">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="count"><span id="phase">正在入 学</span><span id="secs">5.2s</span></div>
  </div>

  <div class="actions">
    <a class="btn" href="https://www.cucn.edu.cn/" id="go">立即前往</a>
    <button id="hold" type="button">按住不走</button>
  </div>
</main>

<div class="confetti" id="confetti" aria-hidden="true"></div>

<p class="foot"><button type="button" id="about-btn">关于本站</button></p>

<dialog id="about">
  <h2>关于本站</h2>
  <p>打开 <b>中国奶娃大学.com</b> 会先看到这个页面，几秒后自动把你送到南京传媒学院官网。</p>
  <p>本站与南京传媒学院无任何官方关联，域名、校徽与页面均为网友自制，仅作趣味跳转之用。</p>
  <p>页面不加载任何第三方脚本、不统计、不追踪。</p>
  <button type="button" id="close-btn">知道了</button>
</dialog>

<script>
(() => {
  const TARGET = "https://www.cucn.edu.cn/";
  const DUR = 5200;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = id => document.getElementById(id);

  const sheet=$("sheet"), crest=$("crest"), walker=$("walker"), shadow=$("shadow"),
        stage=walker.parentElement,
        stamp=$("stamp"), fill=$("fill"), secs=$("secs"), phase=$("phase"),
        frames=[...walker.querySelectorAll(".f")];

  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
  const easeOut=t=>1-Math.pow(1-t,3);
  const T={walk:.06, stamp:.46};

  let start=0, paused=false, done=false, raf=0, stamped=false;

  function frameAt(p){
    if (p < T.walk) return 0;
    if (p > .92) return 2;
    return Math.floor((p - T.walk) * 26) % 2;
  }

  function burst(){
    if (reduced) return;
    const colors=["#1B4B8D","#C9A227","#C8342A","#2F6FBE","#F0C24A"];
    for (let i=0;i<46;i++){
      const s=document.createElement("i");
      s.style.left=(10+Math.random()*80)+"vw";
      s.style.background=colors[i%colors.length];
      s.animate(
        [{transform:"translateY(-12vh) rotate(0deg)",opacity:1},
         {transform:`translateY(${58+Math.random()*40}vh) rotate(${(Math.random()*720-360)|0}deg)`,opacity:0}],
        {duration:1500+Math.random()*1400, easing:"cubic-bezier(.2,.6,.4,1)",
         delay:Math.random()*420, fill:"forwards"}
      );
      $("confetti").appendChild(s);
      setTimeout(()=>s.remove(),3600);
    }
  }

  function render(p){
    const walkP=clamp((p-T.walk)/(.44-T.walk),0,1);
    const f=frameAt(p);
    frames.forEach((el,i)=>el.classList.toggle("on", i===f));

    const hop=Math.abs(Math.sin(walkP*Math.PI*5))*(1-walkP)*9;
    const x=easeOut(walkP)*stage.clientWidth*.17;
    walker.style.transform=`translateX(${x}px) translateY(${-hop}px)`;

    const fw=frames[f].offsetWidth||150;
    shadow.style.transform=`translateX(${x+fw/2-shadow.offsetWidth/2}px) scaleX(${1-hop/70})`;
    shadow.style.opacity=.25+walkP*.55;

    crest.classList.toggle("in", p>.01);
    if (p > T.stamp && !stamped){
      stamped=true;
      stamp.classList.add("in");
      burst();
      sheet.classList.add("shake");
      setTimeout(()=>sheet.classList.remove("shake"),340);
    }

    fill.style.width=(clamp(p,0,1)*100).toFixed(1)+"%";
    secs.textContent=Math.max(0,(1-p)*DUR/1000).toFixed(1)+"s";
    phase.textContent = p<T.walk ? "正在入 学"
                      : p<T.stamp ? "护送中"
                      : p<.92 ? "已录取 · 即将出发" : "出发";
  }

  function leave(){
    if (done) return;
    done=true; cancelAnimationFrame(raf); render(1);
    location.replace(TARGET);
    setTimeout(()=>{ location.href=TARGET; },900);
  }

  function tick(now){
    if (!start) start=now;
    if (paused) start+=16;
    const p=(now-start)/DUR;
    render(Math.min(p,1));
    if (p>=1) return leave();
    raf=requestAnimationFrame(tick);
  }

  sheet.addEventListener("click", e=>{ if (!e.target.closest("button,a")) leave(); });

  const hold=$("hold");
  const grab=on=>{ paused=on; hold.textContent=on?"松开了，继续":"按住不走"; };
  hold.addEventListener("pointerdown", e=>{ e.preventDefault(); grab(true); });
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>hold.addEventListener(ev,()=>grab(false)));

  $("go").addEventListener("click", ()=>{ done=true; cancelAnimationFrame(raf); });

  const dlg=$("about");
  $("about-btn").addEventListener("click", ()=>dlg.showModal());
  $("close-btn").addEventListener("click", ()=>dlg.close());
  dlg.addEventListener("click", e=>{ if (e.target===dlg) dlg.close(); });

  document.addEventListener("keydown", e=>{
    if (e.key==="Enter" && !e.target.closest("button,a")) leave();
  });

  sheet.classList.add("in");
  if (reduced){ render(1); setTimeout(leave,5000); }
  else requestAnimationFrame(tick);
})();
</script>
</body>
</html>
