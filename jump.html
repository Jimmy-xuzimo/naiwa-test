     天空是一张程序化等距柱状图，经 PMREM 卷积成环境光。默认走硬件多重采样直出；

<script>
addEventListener("error",function(e){
  var d=document.createElement("div");
  d.style.cssText="position:fixed;left:0;top:0;right:0;z-index:99;background:#7A1414;color:#fff;"+
    "font:12px/1.6 ui-monospace,monospace;padding:8px 12px;white-space:pre-wrap";
  d.textContent="JS ERROR: "+e.message+" @"+String(e.filename||"").split("/").pop()+":"+e.lineno;
  document.body.appendChild(d);
});
(function(){
"use strict";
var canvas=document.getElementById("gl"), load=document.getElementById("load");
var Q=location.search;
var JUMP=/[?&]jump/.test(Q);
/* 后期链（泛光+调色+FXAA）目前只在 ?post 下开启：它在无头 SwiftShader 下每帧要
   几分钟，我没能把它验收通过，所以默认走硬件 MSAA 直出。
   注意：下面这次 getContext 决定了最终上下文的属性，antialias 必须在这里给，
   WebGLRenderer 上的同名选项对一个已存在的 context 是无效的。 */
var WANT_POST=/[?&]post/.test(Q);
var probe=null;
try{
  probe=canvas.getContext("webgl2",{antialias:!WANT_POST})
      ||canvas.getContext("webgl",{antialias:!WANT_POST});
}catch(e){}
if(!window.THREE||!probe){
  /* 兜底：3D 起不来就退回 2D 跳转动画（index.html 自己会在 5.9 秒后跳南传） */
  load.innerHTML='<div><p style="letter-spacing:.05em">这台设备跑不动 3D，'+
    '正在退回 2D 版…</p></div>';
  setTimeout(function(){location.replace("index.html");},1200);
  return;
}
var T=window.THREE;
var reduce=/[?&]motion=reduce/.test(Q)||
  (/[?&]motion=full/.test(Q)?false:matchMedia("(prefers-reduced-motion: reduce)").matches);
var isMobile=/iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent);
var hiEnd=!/[?&]low/.test(Q)&&!isMobile||/[?&]hi/.test(Q);

/* ══ 1. 程序化贴图工坊：画高度图 → 算法线/粗糙度 ═════════ */
function cvs(w,h){var c=document.createElement("canvas");c.width=w;c.height=h;return c;}
function noise(g,w,h,amt,lo,hi){
  var d=g.getImageData(0,0,w,h),p=d.data;
  for(var i=0;i<p.length;i+=4){
    var v=lo+Math.random()*(hi-lo), base=(p[i]+p[i+1]+p[i+2])/3;
    var mix=base*amt+v*(1-amt);
    p[i]=p[i+1]=p[i+2]=mix;
  }
  g.putImageData(d,0,0);
}
/* 高度图 → 切线空间法线贴图（中心差分） */
function toNormal(src,strength){
  var w=src.width,h=src.height,g=src.getContext("2d");
  var s=g.getImageData(0,0,w,h).data;
  var out=cvs(w,h),og=out.getContext("2d"),oi=og.createImageData(w,h),o=oi.data;
  function H(x,y){x=(x+w)%w;y=(y+h)%h;return s[(y*w+x)*4]/255;}
  for(var y=0;y<h;y++)for(var x=0;x<w;x++){
    var dx=(H(x+1,y)-H(x-1,y))*strength, dy=(H(x,y+1)-H(x,y-1))*strength;
    var len=Math.sqrt(dx*dx+dy*dy+1), i=(y*w+x)*4;
    o[i]=(-dx/len*.5+.5)*255;o[i+1]=(-dy/len*.5+.5)*255;
    o[i+2]=(1/len*.5+.5)*255;o[i+3]=255;
  }
  og.putImageData(oi,0,0);return out;
}
function tex(c,rep,linear){
  var t=new T.CanvasTexture(c);
  if(!linear)t.encoding=T.sRGBEncoding;
  t.anisotropy=8;
  if(rep){t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}
  return t;
}
function stoneMaps(){
  var S=512,h=cvs(S,S),g=h.getContext("2d");
  g.fillStyle="#808080";g.fillRect(0,0,S,S);
  for(var i=0;i<260;i++){
    var x=Math.random()*S,y=Math.random()*S,a=Math.random()*Math.PI,l=8+Math.random()*30;
    g.strokeStyle="rgba(255,255,255,"+(.05+Math.random()*.14)+")";
    g.lineWidth=1+Math.random()*3;g.beginPath();
    g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();
    g.strokeStyle="rgba(0,0,0,"+(.05+Math.random()*.12)+")";g.beginPath();
    g.moveTo(x+2,y+2);g.lineTo(x+2+Math.cos(a)*l,y+2+Math.sin(a)*l);g.stroke();
  }
  noise(g,S,S,.72,60,190);
  var r=cvs(S,S),rg=r.getContext("2d");
  rg.fillStyle="#b8b8b8";rg.fillRect(0,0,S,S);noise(rg,S,S,.55,150,215);
  return {normal:tex(toNormal(h,2.4),null,true),rough:tex(r,null,true)};
}
function fineStone(){
  var S=256,h=cvs(S,S),g=h.getContext("2d");
  g.fillStyle="#808080";g.fillRect(0,0,S,S);
  for(var i=0;i<1100;i++){
    var x=Math.random()*S,y=Math.random()*S,a=Math.random()*6.283,l=3+Math.random()*12;
    g.strokeStyle="rgba(255,255,255,"+(.10+Math.random()*.24)+")";
    g.lineWidth=.7+Math.random()*1.7;
    g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();
    g.strokeStyle="rgba(0,0,0,"+(.10+Math.random()*.22)+")";
    g.beginPath();g.moveTo(x+1,y+1);g.lineTo(x+1+Math.cos(a)*l,y+1+Math.sin(a)*l);g.stroke();
  }
  noise(g,S,S,.62,88,172);
  return tex(toNormal(h,2.0),[7,7],true);
}
function tileMaps(){
  var W=512,H=256,h=cvs(W,H),g=h.getContext("2d");
  for(var x=0;x<W;x++){
    var v=Math.abs(Math.sin(x/W*Math.PI*16)),c=(60+v*130)|0;
    g.fillStyle="rgb("+c+","+c+","+(70+v*120|0)+")";g.fillRect(x,0,1,H);
  }
  for(var y=0;y<H;y+=32){g.fillStyle="rgba(0,0,0,.35)";g.fillRect(0,y,W,2);}
  noise(g,W,H,.8,40,200);
  var r=cvs(W,H),rg=r.getContext("2d");
  rg.fillStyle="#6a6a6a";rg.fillRect(0,0,W,H);noise(rg,W,H,.6,80,190);
  return {normal:tex(toNormal(h,3.6),null,true),rough:tex(r,null,true)};
}
function paveMaps(){
  var S=512,h=cvs(S,S),g=h.getContext("2d");
  g.fillStyle="#9a9a9a";g.fillRect(0,0,S,S);
  g.strokeStyle="rgba(0,0,0,.55)";g.lineWidth=3;
  for(var y=0;y<=S;y+=64){g.beginPath();g.moveTo(0,y);g.lineTo(S,y);g.stroke();}
  for(var x=0;x<=S;x+=128)for(var r2=0;r2<8;r2++){
    var yy=r2*64+((x/128)%2?32:0);
    g.beginPath();g.moveTo(x,yy);g.lineTo(x,yy+64);g.stroke();
  }
  noise(g,S,S,.62,90,190);
  var col=cvs(S,S),cg=col.getContext("2d");
  cg.fillStyle="#6F6D66";cg.fillRect(0,0,S,S);noise(cg,S,S,.5,96,150);
  cg.strokeStyle="rgba(0,0,0,.30)";cg.lineWidth=2;
  for(var yy=0;yy<S;yy+=64){cg.beginPath();cg.moveTo(0,yy);cg.lineTo(S,yy);cg.stroke();}
  for(var xx=0;xx<S;xx+=128)for(var r3=0;r3<8;r3++){
    cg.beginPath();cg.moveTo(xx,r3*64+((xx/128)%2?32:0));cg.lineTo(xx,r3*64+64);cg.stroke();}
  var r=cvs(S,S),rg=r.getContext("2d");
  rg.fillStyle="#7a7a7a";rg.fillRect(0,0,S,S);noise(rg,S,S,.5,105,205);
  return {map:tex(col,[2,2]),normal:tex(toNormal(h,3.4),[2,2],true),rough:tex(r,[2,2],true)};
}
function grassMaps(){
  var S=512,h=cvs(S,S),g=h.getContext("2d");
  g.fillStyle="#707070";g.fillRect(0,0,S,S);
  for(var i=0;i<9000;i++){
    g.strokeStyle="rgba(255,255,255,"+(.1+Math.random()*.35)+")";g.lineWidth=1.2;
    var x=Math.random()*S,y=Math.random()*S;
    g.beginPath();g.moveTo(x,y);g.lineTo(x+(Math.random()-.5)*4,y-3-Math.random()*5);g.stroke();
  }
  var col=cvs(S,S),cg=col.getContext("2d");
  cg.fillStyle="#3F5730";cg.fillRect(0,0,S,S);
  for(var j=0;j<16000;j++){
    cg.fillStyle=Math.random()<.5?"rgba(30,48,24,.62)":"rgba(94,116,58,.42)";
    cg.fillRect(Math.random()*S,Math.random()*S,2,3);
  }
  return {map:tex(col,[46,46]),normal:tex(toNormal(h,1.9),[46,46],true)};
}
function clothRough(){
  var S=256,c=cvs(S,S),g=c.getContext("2d");
  g.fillStyle="#a0a0a0";g.fillRect(0,0,S,S);
  for(var i=0;i<S;i+=3){
    g.fillStyle="rgba(255,255,255,.16)";g.fillRect(i,0,1,S);
    g.fillStyle="rgba(0,0,0,.14)";g.fillRect(0,i,S,1);
  }
  noise(g,S,S,.8,110,190);
  return tex(c,null,true);
}
/* 接触阴影贴片：物体「浮着」的头号元凶就是没有它 */
var _aoCache=null;
function aoTex(){
  if(_aoCache)return _aoCache;
  var S=128,c=cvs(S,S),g=c.getContext("2d");     /* 必须从透明底开始：alpha 才是衰减 */
  var rg=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  rg.addColorStop(0,"rgba(255,255,255,1)");rg.addColorStop(.26,"rgba(255,255,255,.86)");
  rg.addColorStop(.48,"rgba(255,255,255,.44)");rg.addColorStop(.70,"rgba(255,255,255,.12)");
  rg.addColorStop(1,"rgba(255,255,255,0)");
  g.fillStyle=rg;g.fillRect(0,0,S,S);
  _aoCache=tex(c,null,true);
  _aoCache.wrapS=_aoCache.wrapT=T.ClampToEdgeWrapping;
  return _aoCache;
}
var AO_GEO=new T.PlaneGeometry(1,1);
function ao(size,opacity,x,y,z,ry){
  var m=new T.Mesh(AO_GEO,new T.MeshBasicMaterial({
    map:aoTex(),color:0x000000,transparent:true,opacity:opacity===undefined?.34:opacity,
    depthWrite:false,toneMapped:false}));
  if(y===undefined)y=.05;
  m.rotation.x=-Math.PI/2; if(ry)m.rotation.z=ry;
  m.scale.set(size,size,1);m.position.set(x||0,y,z||0);m.renderOrder=1;
  m.raycast=function(){};return m;
}
function bellyTex(){
  var S=256,c=cvs(S,S),g=c.getContext("2d");
  var rg=g.createRadialGradient(S/2,S*.52,0,S/2,S*.52,S*.50);
  rg.addColorStop(0,"rgba(226,214,180,1)");rg.addColorStop(.52,"rgba(226,214,180,1)");
  rg.addColorStop(.78,"rgba(226,214,180,.58)");rg.addColorStop(.93,"rgba(226,214,180,.18)");
  rg.addColorStop(1,"rgba(226,214,180,0)");
  g.save();g.translate(S/2,S*.52);g.scale(.80,1.06);g.translate(-S/2,-S*.52);
  g.fillStyle=rg;g.fillRect(0,0,S,S);g.restore();
  return tex(c);
}
function plaqueTex(text,bg,fg,w,h,size){
  var c=cvs(w,h),g=c.getContext("2d");
  g.fillStyle=bg;g.fillRect(0,0,w,h);
  g.strokeStyle="rgba(255,255,255,.30)";g.lineWidth=Math.max(3,h*.05);
  g.strokeRect(g.lineWidth/2,g.lineWidth/2,w-g.lineWidth,h-g.lineWidth);
  if(!text)return tex(c);
  g.fillStyle=fg;g.textAlign="center";g.textBaseline="middle";
  g.font="700 "+size+'px "Songti SC","STSong","PingFang SC",serif';
  g.shadowColor="rgba(0,0,0,.45)";g.shadowBlur=size*.08;g.shadowOffsetY=size*.04;
  var sp=size*.17,tot=text.length*(size+sp),x=(w-tot)/2+size/2;
  for(var i=0;i<text.length;i++){g.fillText(text.charAt(i),x,h/2);x+=size+sp;}
  return tex(c);
}
function facadeMaps(){
  var W=512,H=512,c=cvs(W,H),g=c.getContext("2d"),e=cvs(W,H),eg=e.getContext("2d");
  g.fillStyle="#8B95A1";g.fillRect(0,0,W,H);
  eg.fillStyle="#000";eg.fillRect(0,0,W,H);

function grime(mat,baseY,span,strength){
  var lo=(1-strength).toFixed(3),lo2=(1-strength*.45).toFixed(3),
      by=baseY.toFixed(2),sp=span.toFixed(2),k="grime"+by+sp+lo;
  var inj="#include <map_fragment>\n"+
    "  float gy=clamp((vWP.y-"+by+")/"+sp+",0.0,1.0);\n"+
    "  gy=pow(gy,0.62);\n"+
    "  float gx=clamp(abs(vWP.x)/18.0,0.0,1.0);\n"+
    "  diffuseColor.rgb*=mix("+lo+",1.0,gy);\n"+
    "  diffuseColor.rgb*=mix(1.0,"+lo2+",gx);";
  mat.onBeforeCompile=function(sh){
    sh.vertexShader="varying vec3 vWP;\n"+sh.vertexShader.replace(
      "#include <begin_vertex>",
      "#include <begin_vertex>\n  vWP=(modelMatrix*vec4(transformed,1.0)).xyz;");
    sh.fragmentShader="varying vec3 vWP;\n"+sh.fragmentShader.replace(
      "#include <map_fragment>",inj);
  };
  mat.customProgramCacheKey=function(){return k;};
  return mat;
}

function roundRect(w,h,r){
  var s=new T.Shape(),x=-w/2,y=-h/2;r=Math.min(r,w/2,h/2);
  s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);
  return s;
}
function bevelBox(w,h,d,r,seg){
  r=Math.min(r,Math.min(w,h,d)/2.3);
  var g=new T.ExtrudeGeometry(roundRect(w,h,r),
    {depth:Math.max(.01,d-r*2),bevelEnabled:true,bevelThickness:r,bevelSize:r,
     bevelSegments:seg||2,curveSegments:seg||3,steps:1});
  g.translate(0,0,-d/2+r);g.computeVertexNormals();
  return g;
}
function mesh(geo,mat,x,y,z){

}

/* 无值哈希噪声：给草地铺一层大尺度色相与干湿变化，破掉「一张贴图刷到底」 */
function h2(x,y){var n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n);}
function vn(x,y){
  var xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi;
  fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);
  return h2(xi,yi)*(1-fx)*(1-fy)+h2(xi+1,yi)*fx*(1-fy)
        +h2(xi,yi+1)*(1-fx)*fy+h2(xi+1,yi+1)*fx*fy;
}

    t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(w/s,h/s);t.needsUpdate=true;
    m[k]=t;});

}

  var g=new T.IcosahedronGeometry(r,2),p=g.attributes.position,v=new T.Vector3();

    var n=Math.sin(v.x*2.1+seed)*Math.cos(v.y*1.7+seed*1.3)*Math.sin(v.z*2.4+seed*.7)
         +Math.sin(v.x*5.3-seed*.6)*Math.cos(v.z*4.7+seed)*.42;
    v.multiplyScalar(1+n*.17);p.setXYZ(i,v.x,v.y,v.z);
  }
  g.computeVertexNormals();
  var m=new T.Mesh(g,mat);m.castShadow=m.receiveShadow=true;return m;
}

function place(m,i,x,y,z,ry,s,sx,sy,sz){
  dummy.position.set(x,y,z);dummy.rotation.set(0,ry,0);
  dummy.scale.set(s*(sx||1),s*(sy||1),s*(sz||1));dummy.updateMatrix();
  m.setMatrixAt(i,dummy.matrix);

function updateCrowd(t,dt){
  var bagN=0;
  for(var i=0;i<CROWD;i++){
    var p=crowd[i];
    if(!p.stat){
      p.x+=p.vx*dt;p.z+=p.vz*dt;
      if(p.x<-13||p.x>13)p.vx*=-1;
      if(p.z<-26||p.z>10)p.vz*=-1;
      p.ry=Math.atan2(-p.vx,-p.vz);
    }
    var moving=p.stat?0:1;
    var sw=reduce?0:Math.sin(t*3.0+p.ph);
    var bob=reduce?0:sw*.028*moving;
    var lean=reduce?0:(p.stat?Math.sin(t*.75+p.ph)*.030          /* 排队的人重心轻移 */
                            :Math.sin(t*3.0+p.ph)*.035);
    var s=p.s, x=p.x, z=p.z;
    var rx=Math.cos(p.ry), rz=-Math.sin(p.ry);      /* 右手方向 */
    var fx=Math.sin(p.ry), fz=Math.cos(p.ry);        /* 面朝方向 */
    var step=reduce?0:Math.sin(t*3.0+p.ph)*.055*moving;
    var swing=reduce?0:Math.sin(t*3.0+p.ph+Math.PI)*.075*moving;
    var lift=reduce?0:Math.max(0,Math.sin(t*3.0+p.ph))*.028*moving;
    place(LEGW,i,x+rx*.095,.25*s+lift,z+rz*.095,p.ry+step,s);
    place(LEGE,i,x-rx*.095,.25*s      ,z-rz*.095,p.ry-step,s);
    place(ARMW,i,x+rx*.215+fx*swing,.855*s+bob,z+rz*.215+fz*swing,p.ry,s);
    place(ARME,i,x-rx*.215-fx*swing,.855*s+bob,z-rz*.215-fz*swing,p.ry,s);
    place(TORS,i,x,.855*s+bob,z,p.ry,s,1+lean*.6,1,1-lean*.6);
    place(HEAD ,i,x,1.335*s+bob,z,p.ry+lean*.8,s);
    place(HAIR ,i,x,1.360*s+bob,z,p.ry+lean*.8,s,1,.72,1);
    place(AOI  ,i,x,.05,z,0,s*1.15);
    if(p.bag&&bagN<26){
      place(BAG,bagN++,x+rx*.34,.29*s,z+rz*.34,p.ry,s*.9);
      BAG.setColorAt(bagN-1,p.bc);
    }
  }
  PARTS.forEach(function(m){m.instanceMatrix.needsUpdate=true;});
  BAG.count=bagN;BAG.instanceMatrix.needsUpdate=true;
  if(BAG.instanceColor)BAG.instanceColor.needsUpdate=true;
}

var hero=new T.Group();

  var PROF=[[0.000,.190],[0.020,.258],[0.060,.306],[0.120,.352],[0.200,.384],
            [0.290,.399],[0.380,.405],[0.470,.401],[0.550,.389],[0.620,.368],
            [0.680,.342],[0.740,.307],[0.795,.266],[0.845,.222],[0.888,.176],
            [0.925,.130],[0.957,.088],[0.982,.050],[1.000,0]];
  function radAt(t){
    if(t<=0)return PROF[0][1];
    for(var i=0;i<PROF.length-1;i++){
      if(t<=PROF[i+1][0]||i===PROF.length-2){
        var a=PROF[i],b=PROF[i+1],k=(t-a[0])/Math.max(1e-6,b[0]-a[0]);
        k=Math.max(0,Math.min(1,k));k=k*k*(3-2*k);
        return a[1]+(b[1]-a[1])*k;

  function bulge(x,t,z){
    var h=Math.hypot(x,z)||1e-6, front=z/h;
    var belly=Math.exp(-Math.pow((t-.40)/.30,2))*.125;
    var lean=Math.max(0,(t-.68)/.32); lean=lean*lean*.085;
    return front*belly-lean*(front*.35+1);

  var bodyGeo=new T.LatheGeometry(profPts,72);

    var a=bodyGeo.attributes.position;
    for(var i=0;i<a.count;i++){
      var x=a.getX(i),y=a.getY(i),z=a.getZ(i);
      a.setZ(i,z+bulge(x,y,z));

var Grade={
  uniforms:{tDiffuse:{value:null},vig:{value:.40},grain:{value:.026},sat:{value:1.02},
            lift:{value:new T.Vector3(.008,.011,.024)},
            gain:{value:new T.Vector3(1.030,1.0,.955)},
            expo:{value:renderer.toneMappingExposure},time:{value:0}},
  vertexShader:"varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}",
  fragmentShader:[
    "uniform sampler2D tDiffuse;uniform float vig,grain,sat,expo,time;uniform vec3 lift,gain;",
    /* 渲进 render target 时 three 会跳过色调映射（只直出屏幕才做），
       所以 ACES 与曝光必须在这里补回来，否则整幅偏暗且高光硬切。 */
    "vec3 aces(vec3 x){return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0);}",
    "varying vec2 vUv;",
    "float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}",
    /* EffectComposer 的中间缓冲是线性空间，渲染到屏幕不会自动转 sRGB；
       缺这一步，高质量档会比低质量档暗一档。这里显式补上。 */
    "vec3 enc(vec3 c){c=max(c,vec3(0.0));",
    "  return mix(pow((c+.055)/1.055,vec3(2.4)),c*12.92,step(c,vec3(.04045)));}",
    "void main(){",
    "  vec3 c=aces(texture2D(tDiffuse,vUv).rgb*expo);",
    "  c=c*gain+lift;",
    "  float l=dot(c,vec3(.2126,.7152,.0722));",
    "  c=mix(vec3(l),c,sat);",
    "  c=c-(c*c*c)*.17;",                       /* 高光软肩：白石头不再糊成一片 */
    "  vec2 q=vUv-.5;c*=1.0-dot(q,q)*vig;",
    "  c=enc(c);",
    "  c+=(h(vUv*vec2(1920.,1080.)+fract(time))-.5)*grain;",
    "  gl_FragColor=vec4(max(c,vec3(0.0)),1.0);}"
  ].join("\n")
};

var HOME={theta:.34,phi:1.505,r:24,ty:3.7};
var orb={theta:HOME.theta,phi:HOME.phi,r:HOME.r,tTheta:HOME.theta,tPhi:HOME.phi,tR:HOME.r,vTheta:0,
  target:new T.Vector3(0,HOME.ty,-12),minPhi:.60,maxPhi:1.545,minR:6,maxR:64};
function applyCam(el){
  var sp=Math.sin(orb.phi);
  camera.position.set(orb.target.x+orb.r*sp*Math.sin(orb.theta),
    orb.target.y+orb.r*Math.cos(orb.phi),
    orb.target.z+orb.r*sp*Math.cos(orb.theta));
  camera.lookAt(orb.target);
}
var ptrs=new Map(),dragging=false,lastX=0,lastY=0,pinch=0,moved=0;
canvas.addEventListener("pointerdown",function(e){
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){dragging=true;lastX=e.clientX;lastY=e.clientY;moved=0;canvas.classList.add("drag");}
  if(ptrs.size===2){var a=[].slice.call(ptrs.values());pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}
  hideTip();
});
canvas.addEventListener("pointermove",function(e){
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){
    var a=[].slice.call(ptrs.values()),d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    if(pinch)orb.tR=T.MathUtils.clamp(orb.tR*(pinch/d),orb.minR,orb.maxR);
    pinch=d;return;
  }
  if(!dragging)return;
  var dx=e.clientX-lastX,dy=e.clientY-lastY;
  lastX=e.clientX;lastY=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
  orb.tTheta-=dx*.0052;
  orb.tPhi=T.MathUtils.clamp(orb.tPhi-dy*.0042,orb.minPhi,orb.maxPhi);
  orb.vTheta=-dx*.0052;
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinch=0;
  if(ptrs.size===0){dragging=false;canvas.classList.remove("drag");}
}
["pointerup","pointercancel","pointerleave"].forEach(function(ev){canvas.addEventListener(ev,endPtr);});

},{passive:false});

var clock=new T.Clock(),tipHidden=false;
function hideTip(){if(tipHidden)return;tipHidden=true;
  var t=document.getElementById("tip");if(t)t.classList.add("hide");}
function frame(){
  var dt=Math.min(clock.getDelta(),.05),el=clock.elapsedTime;
  if(intro.on){
    intro.t+=dt;var p=Math.min(intro.t/intro.dur,1),e=1-Math.pow(1-p,3);
    orb.tR=54+(HOME.r-54)*e;orb.tPhi=.80+(HOME.phi-.80)*e;
    orb.tTheta=-.62+(HOME.theta+.62)*e;
    if(p>=1)intro.on=false;
  }
  if(!dragging){orb.tTheta+=orb.vTheta;orb.vTheta*=.90;if(Math.abs(orb.vTheta)<1e-5)orb.vTheta=0;}
  orb.theta+=(orb.tTheta-orb.theta)*Math.min(1,dt*9);
  orb.phi+=(orb.tPhi-orb.phi)*Math.min(1,dt*9);
  orb.r+=(orb.tR-orb.r)*Math.min(1,dt*6.5);
  if(JUMP)jumpTick(dt);
  applyCam(el);
  if(JUMP)jumpCam();   /* 跳转模式直接摆相机，压掉上面的轨道控制器 */

  var br=Math.sin(el*2.4);
  hero.scale.set(HS*(1-br*.006),HS*(1+br*.014),HS*(1-br*.006));
  var amp=JUMP?0:(intro.on?0:1);
  hero.userData.armR.rotation.z=-Math.sin(el*4.6)*.20*amp;
  hero.userData.armR.rotation.x=Math.sin(el*2.3)*.12*amp;
  var blink=(el%3.4)>3.22?.10:1;
  hero.userData.eyes.forEach(function(x){x.scale.y=blink;});
  if(JUMP)jumpHero();

  if(!reduce){
    for(var i=0;i<trees.length;i++){
      var tr=trees[i],w=Math.sin(el*.85+tr.userData.ph)*.022;
      tr.rotation.z=w;tr.rotation.x=w*.4;
    }
    for(var ti=0;ti<tents.length;ti++){
      var vs=tents[ti].userData.vals||[];
      for(var vi=0;vi<vs.length;vi++){
        var vm=vs[vi],vp=vm.m.geometry.attributes.position,vb=vm.base;
        for(var v2=0;v2<vp.count;v2++){
          var yy=vb[v2*3+1];
          vp.array[v2*3+2]=vb[v2*3+2]+Math.sin(yy*5.2+el*3.1+ti)*.055*(.55-yy);
        }

      }
    }
    for(var b=0;b<wavePlanes.length;b++){
      var pl=wavePlanes[b],pos=pl.geometry.attributes.position,base=pl.userData.base;
      for(var v=0;v<pos.count;v++){
        var x0=base[v*3];
        pos.array[v*3+2]=Math.sin(x0*1.5+el*2.1)*.14*Math.min(1,Math.abs(x0)/3.3)
                        +Math.sin(base[v*3+1]*3+el*3)*.02;
      }
      pos.needsUpdate=true;
    }
    if(LEAVES){
      var arr=lg.attributes.position.array;
      for(var k=0;k<LEAVES;k++){
        var sd=ls[k];
        arr[k*3+1]-=sd.sp*dt;
        arr[k*3]+=Math.sin(el*.9+sd.ph)*sd.amp*dt*.8;
        if(arr[k*3+1]<.2){arr[k*3+1]=11+Math.random()*5;
          arr[k*3]=(Math.random()-.5)*34;arr[k*3+2]=-34+Math.random()*34;}
      }

    }

  if(grade)grade.uniforms.time.value=el;
  if(usePost)composer.render();else renderer.render(scene,camera);

}

      new T.GLTFLoader().load("assets/gate.glb",function(gl){
        var gm=std({normalMap:fstone,roughnessMap:sm.rough,aoMap:aoT,aoMapIntensity:1,
          color:0xA79B83,roughness:1,metalness:0,envMapIntensity:.38});
        grime(gm,.30,7.5,.42);
        gl.scene.traverse(function(o){
          if(!o.isMesh)return;
          o.material=gm;
          if(o.geometry.attributes.uv)o.geometry.setAttribute("uv2",o.geometry.attributes.uv);
          o.castShadow=o.receiveShadow=true;
        });
        gl.scene.rotation.x=-Math.PI/2;   /* 导出没走 Y-up，Z-up 的模型在 three 里是躺着的 */
        gl.scene.updateMatrixWorld(true);
        var bb=new T.Box3().setFromObject(gl.scene);
        gl.scene.position.y-=bb.min.y+gate.position.y;   /* 落地：不管导出把原点放哪都对 */
        gate.add(gl.scene);
        for(var k=0;k<struct.length;k++)struct[k].visible=false;
        STRUCT_ON=false;
      },null,function(e){ console.warn("gate.glb 载入失败，保持程序化校门",e); });
    };
    img.onerror=function(){ console.warn("gate_ao.png 载入失败，保持程序化校门"); };
    img.src="assets/gate_ao.png";
  })();
}

/* ══ 18. UI ═══════════════════════════════════════════ */
/* 跳转页没有「画质 / 回到正门」两个按钮，也不该让别人抢走 #go，
   所以这一段整体换掉（原绑定里 getElementById 会拿到 null 直接抛）。
   注意 usePost 要留着：主循环里 `if(usePost)composer.render()` 在用它，
   整段删掉会变成 ReferenceError，把渲染循环当场打死（表现为"永远不跳转"）。 */
var hi=hiEnd,usePost=!!composer;
if(!hi){renderer.shadowMap.enabled=false;sun.castShadow=hi;}
var dlg=document.getElementById("about");
document.getElementById("about-btn").addEventListener("click",function(){
  jt.paused=true;dlg.showModal();});
document.getElementById("close").addEventListener("click",function(){dlg.close();});
dlg.addEventListener("click",function(e){if(e.target===dlg)dlg.close();});

/* 验收钩子：?still 定帧 + &th=&ph=&r= 摆机位，供无头截图复现 */
if(/[?&]still/.test(Q)){
  intro.on=false;
  orb.theta=orb.tTheta=HOME.theta;orb.phi=orb.tPhi=HOME.phi;orb.r=orb.tR=HOME.r;
  var gq=function(k,d){var m=new RegExp("[?&]"+k+"=([-0-9.]+)").exec(Q);
    return m?parseFloat(m[1]):d;};
  orb.theta=orb.tTheta=gq("th",HOME.theta);orb.phi=orb.tPhi=gq("ph",HOME.phi);
  orb.r=orb.tR=gq("r",HOME.r);
  orb.target.set(gq("tx",0),gq("ty",HOME.ty),gq("tz",-12));
  applyCam();
  /* 定帧跑法下合成帧极少，CSS 淡入走不完，遮罩会一直盖住画面 */
  load.style.transition="none";load.style.display="none";
}
if(/[?&]probe/.test(Q))setTimeout(function(){
  var gl=renderer.getContext(),px=new Uint8Array(4);
  try{gl.readPixels((innerWidth*DPR|0)>>1,(innerHeight*DPR|0)>>1,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);}catch(e){}
  var d=document.createElement("div");
  d.style.cssText="position:fixed;right:6px;bottom:6px;z-index:99;background:#000d;color:#0f0;"+
    "font:11px/1.5 ui-monospace,monospace;padding:6px 8px;border-radius:6px";
  d.textContent="calls="+renderer.info.render.calls+" tris="+renderer.info.render.triangles+
    " glErr="+gl.getError()+" lost="+gl.isContextLost()+
    " px="+Array.prototype.join.call(px,",")+" geo="+renderer.info.memory.geometries+
    " handR="+hero.userData.armR.children[0].children[1].children[1].getWorldPosition(new T.Vector3()).toArray().map(function(v){return v.toFixed(2);}).join(",")+
    " handL="+hero.userData.armL.children[0].children[1].children[1].getWorldPosition(new T.Vector3()).toArray().map(function(v){return v.toFixed(2);}).join(",");
  document.body.appendChild(d);
},60);
window.__cv={orb:orb,camera:camera,scene:scene,renderer:renderer,
  stats:function(){return {calls:renderer.info.render.calls,tris:renderer.info.render.triangles};}};

/* ══ 99. 跳转模式 ═══════════════════════════════════════
   上轨道的入场：推镜 → 奶娃从画外走入 → 招手 → 鞠躬 → 跳南传。
   时间轴是 t 的纯函数（没有积分状态），所以 ?jump&frame=3.2 能定点截图验收。 */
var TARGET="https://www.cucn.edu.cn/";
var jt={t:0,paused:false,fired:false};
/* 相机：一段纯推轨，起终点视线只差约 4°，几乎没有摇镜头，像小摇臂下压。
   P0/L0 直接抄自由漫游已验证过的 HOME 构图当远景。
   为什么要明确摆 camera.position 而不走 orb：轨道控制器的阻尼会把精确机位吃掉。 */
var P0=new T.Vector3(8.0,5.25,10.6), L0=new T.Vector3(0.0,3.7,-12.0);
/* 终点机位压到接近平视（俯角 2.9°）。上一版俯角 9.5°、机位偏到 x=4，
   结果校门整个被报到处帐篷挡掉、背景只剩展板和楼。
   现在站在门洞轴线上、奶娃摆在门洞正前方 z=0.6，
   这样它背后就是校门中柱 —— 匾额(≈15.1°)和红横幅(≈12.1°)刚好卡在画幅上沿内。 */
var P1=new T.Vector3(0.0,2.05,10.4), L1=new T.Vector3(0.0,1.52,0.20);
var _jp=new T.Vector3(), _jl=new T.Vector3();
/* 角色站位：**z>0 的广场上没人**（人群游走范围是 z∈[-22,-2]，报到队列全部 z<=0.2）。
   早期版本把奶娃摆在 (2.05,-5.4) —— 那是报到队伍正中间，
   终点机位等于一头扎进人群，奶娃被裁掉一半、画面全是别人的后脑勺。 */
var H0={x:-5.6,z:0.90,ry:1.57};        /* 画外左起点，面朝 +x 走 */
var H1={x: 0.0,z:0.60,ry:.06};         /* 站位：门洞正前方，几乎正对机位 */
var HY=hero.position.y;
var DUR=reduce?2.6:7.0;

function sstep(t,a,b){return Math.max(0,Math.min(1,(t-a)/(b-a)));}
function sease(p){return 1-Math.pow(1-p,3);}

function jumpCam(){
  var p=reduce?1:sease(sstep(jt.t,0,2.2));
  _jp.lerpVectors(P0,P1,p);_jl.lerpVectors(L0,L1,p);
  camera.position.copy(_jp);camera.lookAt(_jl);
}
function jumpHero(){
  var aR=hero.userData.armR,aL=hero.userData.armL;
  if(reduce){                            /* 减弱动态：直接落在终态，不动 */
    hero.position.x=H1.x;hero.position.z=H1.z;hero.rotation.y=H1.ry;
    hero.rotation.x=0;aR.rotation.set(0,0,0);aL.rotation.set(0,0,0);
    if(heroAO){heroAO.position.x=H1.x;heroAO.position.z=H1.z;}
    return;
  }
  var w=sstep(jt.t,1.8,4.0),we=sease(w);
  hero.position.x=H0.x+(H1.x-H0.x)*we;
  hero.position.z=H0.z+(H1.z-H0.z)*we;
  hero.rotation.y=H0.ry+(H1.ry-H0.ry)*we;
  var walking=(w>0&&w<1);
  hero.position.y=HY+(walking?Math.abs(Math.sin(jt.t*7.6))*.07:0);
  if(heroAO){heroAO.position.x=hero.position.x;heroAO.position.z=hero.position.z;}

  var sw=walking?Math.sin(jt.t*7.6):0;
  aR.rotation.x=sw*.62;aL.rotation.x=-sw*.62;
  aR.rotation.z=walking?-.12:0;aL.rotation.z=walking?.10:0;

  var wv=sstep(jt.t,4.0,5.7);                 /* 招手 */
  if(wv>0&&jt.t<6.0){
    var k=sstep(jt.t,4.1,4.7);
    aR.rotation.z=-1.05*k-Math.sin(jt.t*11.5)*.30*k;
    aR.rotation.x=Math.sin(jt.t*11.5)*.22*k;
    aL.rotation.z=.24*k;
  }
  var bw=sstep(jt.t,5.8,6.15);                /* 鞠躬 → 起 */
  var bu=sstep(jt.t,6.15,6.55);
  hero.rotation.x=(bw-bu)*.34;
  if(jt.t>5.75){var sb=document.getElementById("sub");if(sb)sb.classList.add("on");}
}

function jumpFire(){
  if(jt.fired)return;jt.fired=true;
  location.replace(TARGET);
  setTimeout(function(){location.href=TARGET;},900);   /* replace 被拦时的二道保险 */
}

/* 看门狗：11 秒内没出第一帧（着色器编译失败 / 显存不够 / 崩了）就回退 2D 版 */
var FIRST=false;
setTimeout(function(){ if(!FIRST)location.replace("index.html"); },
           reduce?7000:11000);

function jumpUI(){
  var r=document.getElementById("ring");
  if(r)r.setAttribute("stroke-dashoffset",String(144.5*(1-Math.max(0,Math.min(1,jt.t/DUR)))));
  if(jt.t>=DUR&&!FREEZE)jumpFire();
}

/* 交互：轻点立即前往，长按暂停 */
var FREEZE=(function(){var m=/[?&]frame=([-0-9.]+)/.exec(Q);return m?parseFloat(m[1]):null;})();
if(JUMP){
  canvas.style.cursor="pointer";
  document.getElementById("go").addEventListener("click",function(e){
    e.stopPropagation();jumpFire();});
  var jpd=0,jhold=false,jmoved=0,jx=0,jy=0;
  canvas.addEventListener("pointerdown",function(e){
    jpd=performance.now();jhold=false;jmoved=0;jx=e.clientX;jy=e.clientY;});
  canvas.addEventListener("pointermove",function(e){
    if(!jpd)return;
    jmoved=Math.max(jmoved,Math.abs(e.clientX-jx)+Math.abs(e.clientY-jy));
    if(performance.now()-jpd>400&&jmoved<14){
      jhold=true;jt.paused=true;
      var h=document.getElementById("hold");if(h)h.classList.add("on");
    }});
  var jup=function(){
    if(!jpd)return;
    var held=performance.now()-jpd,wasHold=jhold;jpd=0;
    if(wasHold){jt.paused=false;
      var h=document.getElementById("hold");if(h)h.classList.remove("on");}
    else if(held<400&&jmoved<14)jumpFire();      /* 轻点 = 立即前往 */
  };
  ["pointerup","pointercancel","pointerleave"].forEach(function(ev){
    canvas.addEventListener(ev,jup);});
  document.addEventListener("visibilitychange",function(){
    if(document.hidden)jt.paused=true; else if(!jpd)jt.paused=false;});
}

/* 他本机 macOS 开着「减弱动态效果」，不加这行提示的话打开只会看到一张静止图 */
if(reduce){
  var _tp=document.getElementById("tip");
  if(_tp)_tp.textContent="系统开着「减弱动态效果」，这里直接跳到终帧 · 加 ?motion=full 看完整动画";
}

function jumpTick(dt){
  if(FREEZE!==null){jt.t=FREEZE;jumpCam();jumpUI();return;}
  if(!jt.paused)jt.t+=dt;
  jumpCam();jumpUI();
}

applyCam();if(JUMP)jumpTick(0);updateCrowd(0,0);renderer.render(scene,camera);
requestAnimationFrame(function(){
  load.classList.add("out");
  setTimeout(function(){load.style.display="none";},800);
});
frame();
})();
</script>
